function detail(){let t=tasks[selected];let ns=['预处理','人工标注','标注质检','生产打包','应用编译'];return `<div class="detail-breadcrumb">任务管理 / 任务详情</div>`+heading('任务详情','')+`<div class="card task-overview"><div><h2>基本信息</h2><div class="info-grid"><div><label>任务ID：</label>${11406+selected}</div><div><label>更新基板任务ID：</label><a class="link">11401</a></div><div><label>任务名称：</label>${t[0]}</div><div><label>创建类型：</label><span class="badge">更新</span></div><div><label>任务类型：</label><span class="badge">视频标注任务</span></div><div><label>所属数据集：</label><a class="link">${t[1]}</a></div><div><label>数据集ID：</label>24</div><div><label>原数据：</label>${t[1]} V2.1</div><div><label>任务开始时间：</label>2026-11-02 09:32:00</div><div><label>任务完成时间：</label> - </div><div><label>任务执行时长：</label>1h 24min 58s</div><div><label>任务状态：</label><span style="color:#52c41a">●</span> 待人工确认</div><div><label>操作人：</label>蒋杰翔</div><div><label>描述：</label>多视角视频分割标注</div><div class="inline-progress"><label>任务进度：</label><div class="progress"><i style="width:${t[3]}%"></i></div>${t[3]}%</div></div></div><div class="current-node"><div class="current-labels"><small>当前进度：</small><small>节点状态：</small></div><div class="current-labels"><strong>人工标注</strong><span><i style="color:#1677ff">●</i> 进行中</span></div><div class="detail-actions"><button class="primary" onclick="notify('任务已暂停')">暂停</button><button style="background:#ff4d4f;color:white;border-color:#ff4d4f" onclick="notify('模拟任务已终止')">终止</button><button class="outline" onclick="notify('质检报告：待标注质检节点完成')">质检报告</button><button class="outline" onclick="notify('128 Episodes · 已标注 87 · 完成率 68%')">统计报告</button><button onclick="go('tasks')">返回</button></div></div></div><div class="card node-card"><h2>节点详情</h2><div class="node-scroll"><div class="nodes">${ns.map((n,i)=>`<details class="node" ${i===4?'open':''}><summary><b><label>节点：</label>${n}</b><span><label>节点状态：</label><em style="font-style:normal"><i style="color:${i===0?'#52c41a':i===1?'#1677ff':'#bfbfbf'}">●</i> ${i===0?'已完成':i===1?'进行中':'等待中'}</em></span><span><label>开始时间：</label>${i<2?'2026-11-02 09:'+['32:00','34:36'][i]:' - '}</span><span><label>完成时间：</label>${i===0?'2026-11-02 09:34:36':' - '}</span><span><label>节点执行时长：</label>${i===0?'2min 36s':i===1?'18min 12s':' - '} ⓘ</span><span><label>质检结果：</label><em style="font-style:normal;color:${i===0?'#52c41a':'#faad14'}">${i===0?'通过':'无质检结果'}</em></span><span class="node-ops">${i===0?'已确认':i===1?'<a onclick="event.preventDefault();go(\'studio\')">进入工作区</a>':'<a onclick="event.preventDefault();notify(\'等待上游节点完成\')">重跑</a>　<a onclick="event.preventDefault();notify(\'节点尚未执行\')">节点返回</a>'}</span></summary><div class="node-content"><div><h2>节点输入</h2><p><label>节点输入：</label><a>${i?ns[i-1]:'原始视频数据'}</a>　${i>2?'<a>人工标注</a>':''}</p><p>${t[1]}<br>128 Episodes · 3 cameras</p></div><div><h2>配置信息 <a>⚙</a></h2><p><label>节点镜像：</label>lerobot / ${['preprocess','annotation','quality-check','package','compile'][i]}:v1.0</p><p><label>算法版本：</label>2026.11.02</p><p><label>执行模式：</label>${i===1?'人工标注工作台':'标准流水线'}</p><p><label>质检项：</label>完整性检查　格式检查　帧对齐检查</p></div><div><h2>节点输出</h2><p><label>节点产出：</label><a onclick="notify('当前为模拟产出信息')">产出信息</a>　<a onclick="notify('当前节点：${n}')">运行详情</a>　<button class="outline" onclick="notify('暂无正式质检报告')">质检报告</button>　<a onclick="notify('节点完成后可下载产物')">下载</a></p><p>${i===0?'已处理 128 / 128 Episodes':i===1?'已处理 87 / 128 Episodes':'等待上游节点完成'}</p></div></div></details>`).join('')}</div></div></div>`}
function data(){return heading('数据管理','组织 LeRobot 数据集、Episode 与多相机视频','<button onclick="notify(\'演示模式：支持 LeRobot v2.1 / v3 目录导入\')">＋ 导入数据集</button>')+`<div class="card"><div class="filters"><input placeholder="搜索数据集" oninput="document.querySelectorAll('.ds').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(this.value.toLowerCase()))"></div><div class="tablewrap"><table><tr><th>数据集名称</th><th>格式版本</th><th>Episodes</th><th>相机</th><th>数据大小</th><th>状态</th><th>操作</th></tr>${['panda_pick_color','aloha_transfer_cube','so100_pickplace','droid_kitchen'].map((n,i)=>`<tr class="ds"><td>▣　${n}</td><td>LeRobot ${i%2?'v3.0':'v2.1'}</td><td>${[128,50,240,86][i]}</td><td>3 cameras</td><td>${[12.8,5.2,21.6,9.4][i]} GB</td><td><span class="badge">已就绪</span></td><td><button class="link" onclick="dataset='${n}';episodes()">查看 Episodes</button></td></tr>`).join('')}</table></div></div><div id="episodes"></div>`}function episodes(){let el=$('#episodes');el.innerHTML=`<div class="card"><h2>${dataset} <span class="badge blue">30 FPS</span></h2><p>相机：front / wrist_left / wrist_right　 ·　Action 7 维　 ·　State 7 维</p><table><tr><th>Episode</th><th>任务描述</th><th>帧数</th><th>时长</th><th>操作</th></tr>${Array.from({length:5},(_,i)=>`<tr><td>episode_${String((pg-1)*5+i).padStart(6,'0')}</td><td>将红色方块放入目标容器</td><td>720</td><td>00:24</td><td><button class="link" onclick="go('studio')">打开视频 / 标注</button></td></tr>`).join('')}</table><div class="foot"><button onclick="pg=Math.max(1,pg-1);episodes()">上一页</button>${pg}<button onclick="pg=Math.min(26,pg+1);episodes()">下一页</button></div></div>`}
function dashboard(){return heading('数据看板','欢迎回来，查看工作空间的数据生产概况')+`<div class="stats">${[['数据集','4','全部数据已就绪'],['Episodes','504','共 362,880 帧'],['视频总时长','3.36 h','3 个相机视角'],['标注完成率','68%','87 / 128 Episodes']].map(x=>`<div class="card">${x[0]}<strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</div><div class="card"><h2>数据生产流程</h2><div class="nodes">${['数据采集','数据导入','自动分割','人工校正','质量检查','数据导出'].map((x,i)=>`<button onclick="go('${i<2?'data':'tasks'}')">${x}<span>${[504,504,128,87,64,50][i]} Episodes →</span></button>`).join('')}</div></div><div class="card"><h2>最近任务</h2>${tasks.slice(0,3).map((t,i)=>`<div style="padding:22px 0;border-bottom:1px solid #eee">${t[0]} <span class="badge blue">${t[2]}</span><button class="link" style="float:right" onclick="selected=${i};go('detail')">查看详情 →</button></div>`).join('')}</div>`}
function studio(){return heading('视频分割标注','panda_pick_color / episode_000012','<span><small id="saved">本地草稿</small>　 <button onclick="save()">保存草稿</button> <button class="primary" onclick="save();notify(\'标注已提交至模拟质检队列\')">提交标注</button></span>')+`<div class="studio"><div class="entities"><h2>实体列表 <small>${objects.length}</small></h2><p style="font-size:12px">视频实例 · 跨帧跟踪</p><div id="objects"></div><button style="width:100%;margin-top:20px" onclick="addObject()">＋ 添加实体</button><p style="font-size:12px;line-height:1.8">操作提示<br>选择实体后点击画布添加提示点。<br>空格播放 / 暂停<br>← → 逐帧切换</p><hr style="border:0;border-top:1px solid #eee"><small>SAM3 引擎</small><p><span class="badge blue">模拟预览</span></p><button onclick="notify('模拟传播完成：已生成当前实体的跨帧区间')">▷ 传播到全部帧</button></div><div><div class="tools"><select onchange="camera=this.value;draw()"><option value="front">front · 主视角</option><option value="wrist_left">wrist_left · 左腕</option><option value="wrist_right">wrist_right · 右腕</option></select><span style="flex:1"></span>${['选择','正点','负点','框选'].map(t=>`<button onclick="tool='${t}';document.querySelectorAll('.tools button').forEach(b=>b.classList.toggle('blue',b.textContent==='${t}'))">${t}</button>`).join('')}<button onclick="mask=!mask;draw()">◉ Mask</button><button onclick="points=[];draw()">↶ 重置</button></div><div class="stage" id="stage"></div><div class="tools"><button onclick="step(-1)">Ⅰ◁</button><button id="play" onclick="playing=!playing;this.textContent=playing?'Ⅱ':'▷'">▷</button><button onclick="step(1)">▷Ⅰ</button><span id="frameLabel"></span><span style="flex:1"></span><small>720 帧 · 30 FPS · 1280 × 720</small></div><div class="timeline"><div class="thumbs">${Array.from({length:12},(_,i)=>`<div onclick="frame=${i*60};draw()" style="cursor:pointer"></div>`).join('')}</div><input aria-label="视频时间轴" type="range" min="0" max="719" value="${frame}" oninput="frame=+this.value;draw()"><div style="display:flex;justify-content:space-between;color:#9aa3af;font-size:11px"><span>00:00</span><span>00:06</span><span>00:12</span><span>00:18</span><span>00:24</span></div>${objects.map(o=>`<div class="track"><span style="width:90px">${o.name}</span><i style="--c:${o.color}"></i></div>`).join('')}</div></div></div>`}
let points=[];function draw(){if(page!=='studio')return;$('#objects').innerHTML=objects.map((o,i)=>`<div class="entity ${selected===i?'sel':''}" onclick="selected=${i};draw()"><span class="dot" style="--c:${o.color}"></span>${o.name}<button title="显示或隐藏" onclick="event.stopPropagation();objects[${i}].visible=!objects[${i}].visible;draw()">${o.visible?'◉':'○'}</button><button title="删除实体" onclick="event.stopPropagation();objects.splice(${i},1);selected=0;render()">×</button></div>`).join('');let shift=Math.sin(frame/90)*35;$('#stage').innerHTML=`<svg viewBox="0 0 1000 490" role="img" aria-label="机器人桌面操作模拟视频" onclick="addPoint(event)"><defs><linearGradient id="wall" x2="0" y2="1"><stop stop-color="#b5c0c7"/><stop offset="1" stop-color="#e2e6e6"/></linearGradient><linearGradient id="arm"><stop stop-color="#eff1ef"/><stop offset=".5" stop-color="#bac2c4"/><stop offset="1" stop-color="#f7f7f4"/></linearGradient><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity=".13"/></pattern></defs><rect width="1000" height="490" fill="url(#wall)"/><path d="M0 300L1000 255V490H0" fill="#a6aba6"/><path d="M40 310L900 275 1000 490H0" fill="#c8c8b9"/><rect width="1000" height="490" fill="url(#grid)"/><path d="M70 100H290V260H70Z" fill="#73838a"/><path d="M80 110H280V240H80Z" fill="#91a0a5"/><ellipse cx="755" cy="419" rx="107" ry="22" fill="#48565b" opacity=".2"/><rect x="727" y="325" width="72" height="90" rx="20" fill="url(#arm)"/><path d="M760 330L690 204 585 189 525 287" fill="none" stroke="#69777c" stroke-width="49" stroke-linejoin="round"/><path d="M760 325L690 204 585 189 525 287" fill="none" stroke="url(#arm)" stroke-width="39" stroke-linejoin="round"/><circle cx="690" cy="204" r="29" fill="#dbe0df" stroke="#818e93" stroke-width="6"/><path d="M510 280L495 318M535 280L547 316" stroke="#414d54" stroke-width="13"/><g transform="translate(${shift},0)"><path d="M440 355L490 340 517 359 469 378Z" fill="#d97073"/><path d="M440 355V396L469 416V378Z" fill="#af4e52"/><path d="M469 378L517 359V398L469 416Z" fill="#c25c60"/>${mask&&objects[0]?.visible?`<path d="M435 351L490 335 522 356V401L469 422 435 399Z" fill="${objects[0].color}" fill-opacity=".4" stroke="${objects[0].color}" stroke-width="2"/><rect x="426" y="327" width="105" height="104" fill="none" stroke="${objects[0].color}" stroke-dasharray="5 4"/><rect x="426" y="307" width="90" height="20" fill="${objects[0].color}"/><text x="432" y="322" fill="white" font-size="12">${objects[0].name} 0.98</text>`:''}</g><path d="M190 365L325 350 360 411 213 430Z" fill="#80918f" stroke="#5f7471" stroke-width="9"/>${mask&&objects[2]?.visible?`<path d="M184 359L328 343 369 417 207 438Z" fill="${objects[2].color}" fill-opacity=".35" stroke="${objects[2].color}" stroke-width="2"/>`:''}${mask&&objects[1]?.visible?'<path d="M500 270L542 270 560 323 540 330 522 303 505 330 484 322Z" fill="#66bb9c" fill-opacity=".5" stroke="#66bb9c"/>':''}${points.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="6" fill="${p.negative?'#f45b64':'#287bff'}" stroke="white" stroke-width="2"/>`).join('')}<text x="20" y="28" fill="white" font-size="13">${camera}　 EPISODE 000012</text><text x="20" y="470" fill="#fff" font-size="12">模拟视频画布 · ${String(frame).padStart(6,'0')}</text></svg>`;$('#frameLabel').textContent=`00:${(frame/30).toFixed(2).padStart(5,'0')} / 00:24.00　 第 ${frame+1} 帧`;$('.timeline input').value=frame}function addPoint(e){if(tool==='选择')return;let r=e.currentTarget.getBoundingClientRect();points.push({x:(e.clientX-r.left)/r.width*1000,y:(e.clientY-r.top)/r.height*490,negative:tool==='负点'});draw();notify('已添加'+tool+'提示（模拟分割）')}function step(n){frame=(frame+n+720)%720;draw()}function addObject(){let n=prompt('实体名称','新对象 '+(objects.length+1));if(n){objects.push({name:n.replace(/[<>]/g,''),color:'#e9ad59',visible:true});selected=objects.length-1;render()}}function save(){localStorage.setItem('lr-objects',JSON.stringify(objects));notify('草稿已保存到当前浏览器')}document.addEventListener('keydown',e=>{if(page!=='studio'||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();playing=!playing;$('#play').textContent=playing?'Ⅱ':'▷'}if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});setInterval(()=>{if(playing&&page==='studio')step(1)},1000/30);render();
</script></html>
