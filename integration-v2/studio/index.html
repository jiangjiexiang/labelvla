    <div id="app-boot" aria-label="Loading app">
      <div class="bar" aria-hidden="true"><div id="app-boot-bar"></div></div>
    </div>
    <div id="lerobot-root"></div>
    <script>
      (function () {
        var bar = document.getElementById('app-boot-bar');
        var bootEl = document.getElementById('app-boot');
        if (!bar || !bootEl) return;

        var p = 0;
        var done = false;
        var start = performance.now();

        function set(v) {
          var vv = Math.max(0, Math.min(100, v));
          bar.style.width = vv.toFixed(1) + '%';
        }

        function tick() {
          if (done) return;
          var elapsed = performance.now() - start;
          var target = elapsed < 1200 ? 60 : 90;
          p = p + (target - p) * 0.06 + 0.25;
          if (p > 90) p = 90;
          set(p);
          requestAnimationFrame(tick);
        }
        tick();

        window.__APP_LOADER_DONE__ = function () {
          if (done) return;
          done = true;
          set(100);
          requestAnimationFrame(function () {
            bootEl.style.transition = 'opacity 260ms ease';
            bootEl.style.opacity = '0';
            setTimeout(function () {
              try {
                bootEl.remove();
              } catch (e) {}
            }, 280);
          });
        };
      })();
    </script>
