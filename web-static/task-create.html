<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新建任务 · LeRobot</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="pages.css"></head>
<body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark"><i></i><i></i><i></i></span><span class="brand-name">LeRobot</span><span class="brand-divider"></span><span class="brand-product">数据与标注平台</span></a><div class="topbar-right"><a class="help-link" href="index.html#footer"><svg class="icon"><use href="icons.svg#icon-help"/></svg>帮助中心</a><span class="topbar-separator"></span><span class="avatar">蒋</span><span class="user-name">蒋杰翔</span><span class="user-role">管理员</span></div></header>
<aside class="sidebar"><div class="workspace-switcher"><span class="workspace-label">工作空间</span><span class="workspace-name"><span class="workspace-dot"></span>Default</span></div><nav class="navigation"><div class="nav-group"><a class="nav-item" href="index.html"><svg class="icon"><use href="icons.svg#icon-dashboard"/></svg><span>数据看板</span></a><a class="nav-item" href="data.html"><svg class="icon"><use href="icons.svg#icon-database"/></svg><span>数据管理</span></a><a class="nav-item active" href="tasks.html"><svg class="icon"><use href="icons.svg#icon-task"/></svg><span>任务管理</span><span class="nav-count">5</span></a></div><div class="nav-group"><div class="nav-group-title">标注中心</div><a class="nav-item" href="videos.html"><svg class="icon"><use href="icons.svg#icon-video"/></svg><span>视频库</span></a><a class="nav-item" href="http://172.16.122.44:8002/"><svg class="icon"><use href="icons.svg#icon-workspace"/></svg><span>标注工作区</span></a></div><div class="nav-group"><div class="nav-group-title">系统管理</div><a class="nav-item" href="versions.html"><svg class="icon"><use href="icons.svg#icon-version"/></svg><span>版本管理</span></a><a class="nav-item" href="quality.html"><svg class="icon"><use href="icons.svg#icon-quality"/></svg><span>质检管理</span></a></div></nav><div class="sidebar-footer"><span class="status-dot"></span>所有服务运行正常<span class="version">v2.1</span></div></aside>
<main class="main-content"><div class="breadcrumb"><a href="tasks.html">任务管理</a><span>/</span><span>新建任务</span></div><section class="page-heading"><div><h1>新建任务</h1><p>配置数据集与处理流程，创建新的数据生产任务</p></div><a class="button" href="tasks.html"><svg class="icon"><use href="icons.svg#icon-back"/></svg>返回任务列表</a></section>
<form class="card create-form" action="tasks.html" method="get"><div class="form-section"><div class="form-section-title"><span>1</span><div><h2>基本信息</h2><p>填写任务名称并选择需要处理的数据集</p></div></div><div class="form-grid"><label class="form-field full"><span>任务名称 <b>*</b></span><input name="name" required value="颜色分拣 · SAM3 视频分割" placeholder="请输入任务名称"></label><label class="form-field"><span>任务类型 <b>*</b></span><select name="type"><option>视频标注任务</option><option>数据预处理任务</option><option>数据质检任务</option></select></label><label class="form-field"><span>创建类型</span><select><option>新建</option><option>更新</option></select></label><label class="form-field full"><span>关联数据集 <b>*</b></span><select name="dataset"><option>panda_pick_color · 128 Episodes</option><option>aloha_transfer_cube · 50 Episodes</option><option>so100_pickplace · 240 Episodes</option><option>droid_kitchen · 86 Episodes</option></select><small>LeRobot v2.1 · 3 cameras · 12.8 GB</small></label><label class="form-field full"><span>任务描述</span><textarea rows="3">多视角视频分割标注，包含实体跨帧跟踪与人工校正</textarea></label></div></div>
<div class="form-section"><div class="form-section-title"><span>2</span><div><h2>流程配置</h2><p>选择任务需要执行的数据生产节点</p></div></div><div class="workflow-options"><label><input type="checkbox" checked disabled><span class="workflow-check"><svg class="icon"><use href="icons.svg#icon-check"/></svg></span><div><strong>预处理</strong><small>格式转换与完整性检查</small></div><em>必选</em></label><label><input type="checkbox" checked><span class="workflow-check"><svg class="icon"><use href="icons.svg#icon-check"/></svg></span><div><strong>人工标注</strong><small>SAM3 视频分割与人工校正</small></div><em>推荐</em></label><label><input type="checkbox" checked><span class="workflow-check"><svg class="icon"><use href="icons.svg#icon-check"/></svg></span><div><strong>标注质检</strong><small>完整性与标注质量检查</small></div></label><label><input type="checkbox" checked><span class="workflow-check"><svg class="icon"><use href="icons.svg#icon-check"/></svg></span><div><strong>生产打包</strong><small>生成标准 LeRobot 数据集</small></div></label></div></div>
<div class="form-section"><div class="form-section-title"><span>3</span><div><h2>标注配置</h2><p>设置视频分割引擎和标注要求</p></div></div><div class="form-grid"><label class="form-field"><span>分割引擎</span><select><option>SAM3 视频分割</option><option>人工框选</option></select></label><label class="form-field"><span>算法版本</span><select><option>2026.11.02（最新）</option><option>2026.10.18</option></select></label><label class="form-field full"><span>标注说明</span><textarea rows="3" placeholder="请输入实体范围、跟踪要求和质检标准">跟踪红色方块、机械臂夹爪与目标容器，确保实体 Mask 跨帧一致。</textarea></label></div></div>
<div class="form-actions"><a class="button" href="tasks.html">取消</a><button class="button" type="button">保存草稿</button><button class="button button-primary" type="submit">创建任务</button></div></form>
</main></body></html>
